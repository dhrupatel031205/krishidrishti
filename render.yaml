services:
  - type: web
    name: krishidrishti-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_crop.py --csv crop_recommendation.csv
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_KEY
        sync: false
    healthCheckPath: /health
